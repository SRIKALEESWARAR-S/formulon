[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formulon-physics"
dynamic = ["version"]
description = "Validated physics formulas plus verified PINN benchmark problems and ML feature tools; optional quantum computing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["physics", "quantum", "formulas", "science", "education", "numpy", "scipy", "pinn", "jax", "pytorch", "spec-driven-development", "physics-informed", "scientific-machine-learning", "benchmark", "surrogate-modeling", "pennylane", "qiskit"]
authors = [
  { name = "SRIKALEESWARAR-S", email = "srikaleeswarar675@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.22.0",
  "scipy>=1.8.0",
  "pint>=0.24.0",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
pennylane = ["pennylane>=0.35"]
units = ["pint>=0.24.0"]
quantum = ["qiskit>=1.0", "pennylane>=0.35"]
jit = ["numba>=0.56"]
ml = ["torch>=2.0"]
jax = ["jax>=0.4.20"]
qml = ["qiskit>=1.0", "qiskit-aer>=0.13", "pennylane>=0.35", "torch>=2.0", "scikit-learn>=1.2"]
dev = ["pytest>=7", "pytest-cov"]
all = ["numba>=0.56", "pint>=0.24.0", "qiskit>=1.0", "qiskit-aer>=0.13", "pennylane>=0.35", "torch>=2.0", "jax>=0.4.20", "scikit-learn>=1.2"]

[project.urls]
Documentation = "https://github.com/SRIKALEESWARAR-S/formulon#readme"
Issues = "https://github.com/SRIKALEESWARAR-S/formulon/issues"
Source = "https://github.com/SRIKALEESWARAR-S/formulon"

[tool.hatch.version]
path = "src/formulon/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/formulon"]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/formulon tests}"

[tool.coverage.run]
source_pkgs = ["formulon", "tests"]
branch = true
parallel = true
omit = [
  "src/formulon/__about__.py",
]

[tool.coverage.paths]
formulon = ["src/formulon", "*/formulon/src/formulon"]
tests = ["tests", "*/formulon/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
