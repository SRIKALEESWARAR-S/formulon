[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formulon-physics"
dynamic = ["version"]
description = "An optimized open-source computational library for high-performance mathematical and physical formulas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["physics", "formulas", "science", "education", "numpy", "scipy", "numba"]
authors = [
  { name = "SRIKALEESWARAR-S", email = "srikaleeswarar675@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.22.0",
  "scipy>=1.8.0",
  "numba>=0.56.0",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
pennylane = ["pennylane>=0.35"]
quantum = ["formulon-physics[qiskit,pennylane]"]

[project.urls]
Documentation = "https://github.com/SRIKALEESWARAR-S/formulon#readme"
Issues = "https://github.com/SRIKALEESWARAR-S/formulon/issues"
Source = "https://github.com/SRIKALEESWARAR-S/formulon"

[tool.hatch.version]
path = "src/formulon/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/formulon tests}"

[tool.coverage.run]
source_pkgs = ["formulon", "tests"]
branch = true
parallel = true
omit = [
  "src/formulon/__about__.py",
 ]

[tool.coverage.paths]
formulon = ["src/formulon", "*/formulon/src/formulon"]
tests = ["tests", "*/formulon/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
